[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "kg-sdk"
version = "0.1.0"
description = "Synchronous Python SDK backed by the Rust kg-builder engine"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.scripts]
kg = "kg_sdk.cli:main"

[project.optional-dependencies]
profiles = ["PyYAML>=6,<7"]

[tool.maturin]
manifest-path = "../../rust/kg-python/Cargo.toml"
python-source = "src"
module-name = "kg_sdk._native"
