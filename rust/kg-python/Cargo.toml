[package]
name = "kg-python"
description = "Python bindings for the synchronous kg-builder engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:tonic"]

[dependencies]
kg-core.workspace = true
kg-stages.workspace = true
kg-storage-neo4j.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "fs", "signal"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
url = "2"
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "grpc-tonic", "gzip-tonic"], optional = true }
tracing-opentelemetry = { version = "0.33", default-features = false, features = ["metrics"], optional = true }
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-native-roots"], optional = true }
tokio-util.workspace = true

pyo3 = { version = "=0.29.2", features = ["abi3-py311"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics", "testing"] }
